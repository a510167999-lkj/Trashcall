name: Trashcall
options:
  bundleIdPrefix: com.trashcall
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: L39339626G
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  Trashcall:
    build:
      targets:
        Trashcall: all
        TrashcallCallDirectory: all
        TrashcallBlockDirectory: all
        TrashcallCore: all
    run:
      config: Debug
      executable: Trashcall
      disableMainThreadChecker: true

targets:
  TrashcallCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Trashcall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trashcall.core
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  Trashcall:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "*.sqlite-wal"
          - "*.sqlite-shm"
    dependencies:
      - target: TrashcallCore
        embed: true
      - target: TrashcallCallDirectory
      - target: TrashcallBlockDirectory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trashcall.app
        CODE_SIGN_ENTITLEMENTS: App/Trashcall.entitlements
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 11
        MARKETING_VERSION: 1.1.2

  TrashcallCallDirectory:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/CallDirectory/Sources
      - path: Extensions/CallDirectory/Resources/Info.plist
      - path: App/Resources/Assets.xcassets
    dependencies:
      - target: TrashcallCore
        embed: false
      - sdk: CallKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trashcall.app.CallDirectoryExtension
        CODE_SIGN_ENTITLEMENTS: Extensions/CallDirectory/CallDirectory.entitlements
        INFOPLIST_FILE: Extensions/CallDirectory/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 11
        MARKETING_VERSION: 1.1.2

  TrashcallBlockDirectory:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/BlockDirectory/Sources
      - path: Extensions/BlockDirectory/Resources/Info.plist
      - path: App/Resources/Assets.xcassets
    dependencies:
      - target: TrashcallCore
        embed: false
      - sdk: CallKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trashcall.app.BlockDirectoryExtension
        CODE_SIGN_ENTITLEMENTS: Extensions/BlockDirectory/BlockDirectory.entitlements
        INFOPLIST_FILE: Extensions/BlockDirectory/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 11
        MARKETING_VERSION: 1.1.2
