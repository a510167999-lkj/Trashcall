name: wb-ticker

# 为什么存在：GitHub 对 wb-credits（2026-10-22 新建）不投递 schedule 事件，
# 而本仓库的定时器自 2026-09 以来每周稳定触发（已验证 5 次）。
# 所以由本仓库到点触发 wb-credits 的签到 workflow（dispatch 秒级可用，实测）。
# token 为细粒度 PAT（仅 wb-credits / Actions:write），存于本仓库 secrets，其余权限全无。

on:
  schedule:
    # UTC；= 北京 09:17 / 11:17 / 13:17 / 15:17 / 17:17
    # 目标侧全部幂等（已签跳过、已领跳过），多触发无副作用
    - cron: '17 1,3,5,7,9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'status = 只读探测；claim = 真领'
        required: false
        default: 'claim'

permissions:
  contents: read

concurrency:
  group: wb-ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 触发 wb-credits
        env:
          TOKEN: ${{ secrets.WB_DISPATCH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'claim' }}
        run: |
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/a510167999-lkj/wb-credits/actions/workflows/checkin.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"${MODE}\"}}")
          echo "dispatch http=${code} mode=${MODE} (utc $(date -u +%FT%TZ))"
          [ "$code" = "204" ] || { cat /tmp/resp.txt; exit 1; }
